name: TeamTalk Windows CI

on:
  push:
    branches: [ master ]
    paths:
      - 'win-client/**'
      - '.github/workflows/win.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'win-client/**'
      - '.github/workflows/win.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # DuiLib 等模块依赖 ATL (atlbase.h/atlconv.h/atlcomcli.h)，默认 runner 未安装该组件，需手动安装
      - name: Install ATL build tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          # VS Installer 的 setup.exe 与 vswhere 同目录，不在安装目录内
          $installerDir = Split-Path $vswhere
          $setup = Join-Path $installerDir "setup.exe"
          if (-not (Test-Path $setup)) { throw "VS Installer setup.exe not found: $setup" }
          Write-Host "Modifying VS at $installPath to add ATL component..."
          $p = Start-Process -FilePath $setup -ArgumentList @(
            'modify','--installPath',"`"$installPath`"",
            '--add','Microsoft.VisualStudio.Component.VC.ATL',
            '--quiet','--norestart','--wait'
          ) -Wait -PassThru -NoNewWindow
          Write-Host "setup.exe exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "VS installer failed with exit code $($p.ExitCode)" }
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found via vswhere" }
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild win-client/solution/teamtalk.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build-output
          path: win-client/bin
