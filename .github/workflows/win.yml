name: TeamTalk Windows CI

on:
  push:
    branches: [ master ]
    paths:
      - 'win-client/**'
      - '.github/workflows/win.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'win-client/**'
      - '.github/workflows/win.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSBuild (VS2022, retarget to v143)
        shell: pwsh
        run: |
          $msbuild = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild win-client/solution/teamtalk.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build-output
          path: win-client/bin
