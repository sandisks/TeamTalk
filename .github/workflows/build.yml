name: TeamTalk CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Server (Linux)
  # ---------------------------------------------------------------------------
  server:
    name: Server (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make wget unzip pkg-config \
            libuuid-dev libcurl4-openssl-dev libssl-dev zlib1g-dev \
            libmariadb-dev liblog4cxx-dev libapr1-dev libaprutil1-dev

      - name: Build protobuf 2.6.1
        working-directory: server/src
        run: |
          export CXXFLAGS="-std=c++11"
          export MAKEFLAGS=-j2
          sudo -E bash make_protobuf.sh

      - name: Build hiredis
        working-directory: server/src
        run: |
          sudo -E bash make_hiredis.sh

      - name: Provide log4cxx & mysql headers/libraries
        working-directory: server/src
        run: |
          mkdir -p slog/include slog/lib
          cp -r /usr/include/log4cxx slog/include/
          ln -sf /usr/lib/x86_64-linux-gnu/liblog4cxx.so slog/lib/liblog4cxx.so
          sudo mkdir -p /usr/lib64/mysql
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libmariadb.so /usr/lib64/mysql/libmysqlclient_r.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libmariadb.so /usr/lib64/mysql/libmysqlclient.so
          sudo ln -sfn /usr/include/mariadb /usr/include/mysql

      - name: Build all servers
        working-directory: server/src
        run: |
          set -e
          export CPLUS_INCLUDE_PATH=$PWD/slog
          export LD_LIBRARY_PATH=$PWD/slog:$PWD/slog/lib:$LD_LIBRARY_PATH
          export LIBRARY_PATH=$PWD/slog:$PWD/slog/lib:$LIBRARY_PATH

          cat > base/version.h <<'EOF'
          #ifndef __VERSION_H__
          #define __VERSION_H__
          #define VERSION "ci-build"
          #endif
          EOF

          for i in base slog; do
            (cd "$i" && cmake . && make -j2)
          done

          mkdir -p base/slog/lib
          cp slog/slog_api.h base/slog/
          cp slog/libslog.so base/slog/lib/
          cp -a slog/lib/liblog4cxx.so* base/slog/lib/

          for i in route_server msg_server http_msg_server file_server push_server tools db_proxy_server msfs login_server; do
            (cd "$i" && cmake . && make -j2)
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-bin
          path: server/src/bin

  # ---------------------------------------------------------------------------
  # iOS
  # ---------------------------------------------------------------------------
  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CocoaPods
        run: |
          gem install cocoapods -v 1.15.2 --no-document || sudo gem install cocoapods -v 1.15.2 --no-document

      - name: Pod install
        working-directory: ios
        run: |
          pod install --repo-update || pod install

      - name: Build
        working-directory: ios
        run: |
          xcodebuild -workspace TeamTalk.xcworkspace -scheme TeamTalk \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios/build/Build/Products

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  mac:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CocoaPods
        run: |
          gem install cocoapods -v 1.15.2 --no-document || sudo gem install cocoapods -v 1.15.2 --no-document

      - name: Pod install
        working-directory: mac
        run: |
          pod install --repo-update || pod install

      - name: Build
        working-directory: mac
        run: |
          xcodebuild -workspace TeamTalk.xcworkspace -scheme TeamTalk \
            -configuration Debug -derivedDataPath build \
            MACOSX_DEPLOYMENT_TARGET=10.15 build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: mac/build/Build/Products

  # ---------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install legacy SDK packages
        run: |
          sdkmanager --install "platforms;android-19" "build-tools;21.1.2" || true
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-all.zip
          unzip -q gradle-2.14.1-all.zip

      - name: Add Maven Central fallback repositories
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
            buildscript {
              repositories {
                mavenCentral()
              }
            }
            repositories {
              mavenCentral()
            }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"
        run: |
          ../gradle-2.14.1/bin/gradle assembleDebug --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk

  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  win:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSBuild (VS2022, retarget to v143)
        shell: pwsh
        run: |
          $msbuild = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild win-client/solution/teamtalk.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build-output
          path: win-client/bin
